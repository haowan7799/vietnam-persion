<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Fredoka"; src: url("fonts/Fredoka.ttf"); font-weight: 300 700; }
@font-face { font-family: "Pacifico"; src: url("fonts/Pacifico.ttf"); }
html, body { margin: 0; background: #111; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// One continuous shot, 30s @ 120 BPM. renderFrame(t) is pure in t, so frames
// can be rendered in any order / in parallel. Times match music.py.
const W = 1920, H = 1080, BEAT = 0.5;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const F = (w, s) => `${w} ${s}px Fredoka`;

// ------------------------------------------------------------------ helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: t => t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
function keys(t, ks) { // ks: [time, [values], ease]
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 0; i < ks.length - 1; i++) {
    const a = ks[i], b = ks[i + 1];
    if (t <= b[0]) {
      const p = (E[b[2] || "inOut"])(seg(t, a[0], b[0]));
      return a[1].map((v, j) => lerp(v, b[1][j], p));
    }
  }
  return ks[ks.length - 1][1];
}
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const drumsOn = t => (t >= 3 && t < 20.5) || (t >= 22 && t < 28.2);
const pulse = (t, k = 9) => drumsOn(t) ? Math.exp(-(((t % BEAT) + BEAT) % BEAT) * k) : 0;
const pop = (t, at, d = .35) => t < at ? 0 : E.back(seg(t, at, at + d));

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(r, 0), 0, Math.PI * 2); }
function star4(x, y, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = rot + i * Math.PI / 4, rr_ = i % 2 ? r * .32 : r;
    ctx.lineTo(x + Math.cos(a) * rr_, y + Math.sin(a) * rr_);
  }
  ctx.closePath();
}
function starN(x, y, r, n = 5, inner = .45, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n, q = i % 2 ? r * inner : r;
    ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
  }
  ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * .35, x - s * .45, y - s * 1.05, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .45, y - s * 1.05, x + s * 1.1, y - s * .35, x, y + s * .35);
  ctx.closePath();
}
// bold "sticker" text with outline
function label(txt, x, y, size, fill, opts = {}) {
  ctx.save();
  ctx.translate(x, y);
  if (opts.rot) ctx.rotate(opts.rot);
  if (opts.scale !== undefined) ctx.scale(opts.scale, opts.scale);
  ctx.globalAlpha *= opts.alpha ?? 1;
  ctx.font = F(700, size);
  ctx.textAlign = opts.align || "center";
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  if (opts.shadow !== false) {
    ctx.fillStyle = opts.shadowColor || "#2B2250";
    ctx.fillText(txt, size * .06, size * .09);
  }
  ctx.lineWidth = size * (opts.stroke ?? .2);
  ctx.strokeStyle = opts.strokeColor || "#2B2250";
  ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = fill;
  ctx.fillText(txt, 0, 0);
  ctx.restore();
}
// pop-in, hold, fade-out sticker label
function burstLabel(t, at, txt, x, y, size, fill, rot = 0, hold = .55) {
  if (t < at || t > at + hold + .2) return;
  const s = E.back(seg(t, at, at + .22));
  const a = 1 - seg(t, at + hold, at + hold + .2);
  label(txt, x, y - 20 * seg(t, at, at + hold + .2), size, fill, { scale: s, alpha: a, rot });
}

// ------------------------------------------------------------------ palette
const C = {
  ink: "#2B2250", coral: "#E8825F", coralD: "#C9623F", coralL: "#F6B193",
  cream: "#FFF4E6", pink: "#FF6FA8", purple: "#7B61FF", mint: "#4FD6B5",
  yellow: "#FFD23F", blue: "#4CC9F0", red: "#FF4D6D",
};
const RAINBOW = [C.pink, C.yellow, C.mint, C.blue, C.purple, "#FF9F43"];

// ------------------------------------------------------------------ thumbnails (mini clips)
function drawThumb(type, x, y, w, h, lt, opts = {}) {
  ctx.save();
  rr(x, y, w, h, opts.r ?? Math.min(w, h) * .12);
  ctx.clip();
  const u = Math.min(w, h), cx = x + w / 2, cy = y + h / 2;
  if (type === "cat") {
    ctx.fillStyle = "#FFE0A8"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#FFC97A";
    for (let i = 0; i < 6; i++) { circle(x + w * rnd(i) , y + h * rnd(i + 9), u * .12); ctx.fill(); }
    ctx.save();
    ctx.translate(cx, y + h * .62);
    ctx.rotate(Math.sin(lt * 7) * .12);
    const r = u * .3;
    ctx.fillStyle = "#F28C38";
    ctx.beginPath(); ctx.moveTo(-r * .95, -r * .2); ctx.lineTo(-r * .7, -r * 1.25); ctx.lineTo(-r * .15, -r * .8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(r * .95, -r * .2); ctx.lineTo(r * .7, -r * 1.25); ctx.lineTo(r * .15, -r * .8); ctx.fill();
    circle(0, 0, r); ctx.fill();
    ctx.fillStyle = C.ink;
    const bl = (lt % 2.2) < .12 ? .15 : 1;
    ctx.beginPath(); ctx.ellipse(-r * .38, -r * .1, r * .11, r * .16 * bl, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * .38, -r * .1, r * .11, r * .16 * bl, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#FF8FAB"; circle(0, r * .18, r * .09); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(1, r * .05);
    for (const s of [-1, 1]) for (const k of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(s * r * .3, r * .25 + k * r * .06); ctx.lineTo(s * r * 1.05, r * .2 + k * r * .18); ctx.stroke();
    }
    ctx.restore();
  } else if (type === "skate") {
    ctx.fillStyle = "#8ED1FC"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 3; i++) {
      const px = x + ((rnd(i) * w - lt * w * .15) % w + w) % w;
      ctx.beginPath(); ctx.ellipse(px, y + h * (.18 + .12 * i), u * .14, u * .05, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = "#6C5CE7"; ctx.fillRect(x, y + h * .74, w, h * .26);
    ctx.fillStyle = "#A29BFE";
    for (let i = 0; i < 8; i++) ctx.fillRect(x + ((i * w / 4 - lt * w * .9) % (w * 2) + w * 2) % (w * 2) - w * .2, y + h * .84, w * .1, h * .03);
    const sx = cx + Math.sin(lt * 2) * w * .18, sy = y + h * .74 - Math.abs(Math.sin(lt * 5)) * h * .06;
    ctx.fillStyle = "#FF6B6B"; rr(sx - u * .2, sy - u * .07, u * .4, u * .06, u * .03); ctx.fill();
    ctx.fillStyle = C.ink; circle(sx - u * .13, sy - u * .005, u * .035); ctx.fill(); circle(sx + u * .13, sy - u * .005, u * .035); ctx.fill();
    ctx.fillStyle = C.yellow; rr(sx - u * .08, sy - u * .36, u * .16, u * .28, u * .06); ctx.fill();
    ctx.fillStyle = "#FFD7B5"; circle(sx, sy - u * .43, u * .09); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = Math.max(1, u * .02);
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(sx - u * (.3 + i * .05), sy - u * (.1 + i * .1)); ctx.lineTo(sx - u * (.55 + i * .08), sy - u * (.1 + i * .1)); ctx.stroke(); }
  } else if (type === "sunset") {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, "#6A4C93"); g.addColorStop(.55, "#FF7E5F"); g.addColorStop(1, "#FEB47B");
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#FFE66D"; circle(cx, y + h * (.55 + .04 * Math.sin(lt)), u * .22); ctx.fill();
    ctx.fillStyle = "#3D348B"; ctx.fillRect(x, y + h * .66, w, h * .34);
    ctx.strokeStyle = "rgba(255,230,109,.8)"; ctx.lineWidth = Math.max(1, u * .025);
    for (let i = 0; i < 4; i++) {
      const ww = u * (.36 - i * .06), yy = y + h * (.72 + i * .07), off = Math.sin(lt * 3 + i) * u * .04;
      ctx.beginPath(); ctx.moveTo(cx - ww + off, yy); ctx.lineTo(cx + ww + off, yy); ctx.stroke();
    }
    ctx.fillStyle = C.ink;
    for (let i = 0; i < 2; i++) {
      const bx = x + w * (.25 + .2 * i) + Math.sin(lt * 1.5 + i) * u * .05, by = y + h * (.25 + .07 * i);
      ctx.beginPath(); ctx.moveTo(bx - u * .05, by); ctx.quadraticCurveTo(bx, by - u * .03 * (1 + Math.sin(lt * 9 + i)), bx, by + u * .01);
      ctx.quadraticCurveTo(bx, by - u * .03 * (1 + Math.sin(lt * 9 + i)), bx + u * .05, by); ctx.lineWidth = Math.max(1, u * .015); ctx.strokeStyle = C.ink; ctx.stroke();
    }
  } else if (type === "dance") {
    ctx.fillStyle = "#FF5FA2"; ctx.fillRect(x, y, w, h);
    ctx.save(); ctx.translate(cx, y);
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4 + lt * .15);
      ctx.fillStyle = i % 2 ? "rgba(255,255,255,.18)" : "rgba(255,210,63,.22)";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-u * .25, u * 2); ctx.lineTo(u * .25, u * 2); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = "#E0E0FF"; circle(cx, y + h * .12, u * .1); ctx.fill();
    ctx.fillStyle = "#fff"; star4(cx + u * .04, y + h * .1, u * .05, lt * 3); ctx.fill();
    // little dancer
    const b = Math.abs(Math.sin(lt * Math.PI * 2)) * u * .05, d = Math.sin(lt * Math.PI * 2) > 0 ? 1 : -1;
    ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(1.5, u * .045); ctx.lineCap = "round";
    const hx = cx, hy = y + h * .45 - b;
    ctx.fillStyle = C.ink; circle(hx, hy, u * .08); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx, hy + u * .08); ctx.lineTo(hx, hy + u * .3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx, hy + u * .14); ctx.lineTo(hx + d * u * .18, hy - u * .05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx, hy + u * .14); ctx.lineTo(hx - d * u * .18, hy + u * .24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx, hy + u * .3); ctx.lineTo(hx - u * .12, hy + u * .45 + b); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx, hy + u * .3); ctx.lineTo(hx + u * .12, hy + u * .45 + b); ctx.stroke();
  } else if (type === "food") {
    ctx.fillStyle = "#FFF3B0"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#FFE066";
    for (let i = 0; i < 5; i++) { star4(x + w * rnd(i + 3), y + h * rnd(i + 7) * .5, u * .05, lt); ctx.fill(); }
    ctx.strokeStyle = "rgba(160,160,160,.8)"; ctx.lineWidth = Math.max(1, u * .03); ctx.lineCap = "round";
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      for (let k = 0; k <= 10; k++) {
        const yy = y + h * (.5 - k * .035), xx = cx + i * u * .15 + Math.sin(k * .8 + lt * 5 + i) * u * .04;
        k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
      }
      ctx.stroke();
    }
    ctx.fillStyle = "#F4A261"; ctx.beginPath(); ctx.ellipse(cx, y + h * .6, u * .36, u * .07, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#FFD166"; ctx.lineWidth = Math.max(1, u * .025);
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(cx - u * .15 + i * u * .1, y + h * .6, u * .06, Math.PI, 0); ctx.stroke(); }
    ctx.fillStyle = "#E63946"; ctx.beginPath(); ctx.arc(cx, y + h * .6, u * .37, 0, Math.PI); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillRect(cx - u * .37, y + h * .6, u * .74, u * .03);
    ctx.strokeStyle = "#8D5524"; ctx.lineWidth = Math.max(1.5, u * .03);
    ctx.beginPath(); ctx.moveTo(cx + u * .1, y + h * .58); ctx.lineTo(cx + u * .45, y + h * .25 + Math.sin(lt * 4) * u * .03); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + u * .16, y + h * .58); ctx.lineTo(cx + u * .5, y + h * .3 + Math.sin(lt * 4) * u * .03); ctx.stroke();
  }
  ctx.restore();
}

// ------------------------------------------------------------------ layout constants
const SCR = { x: 540, y: 130, w: 940, h: 570 };
const PV = { x: 780, y: 186, w: 470, h: 264 };
const TL = { x: 550, y: 466, w: 920, h: 226 };
const TRACK = { video: [500, 58], text: [566, 24], fx: [596, 24], audio: [628, 50] };
const CLIPS = [
  { type: "cat", w: 160, land: 3.5 },
  { type: "skate", w: 200, land: 4.0 },
  { type: "sunset", w: 170, land: 4.5 },
  { type: "dance", w: 190, land: 5.0 },
  { type: "food", w: 150, land: 5.5 },
];
{ let x = 575; for (const c of CLIPS) { c.x = x; x += c.w; } }
const CUTS = [{ t: 7.5, x: 650 }, { t: 8.0, x: 845 }, { t: 8.5, x: 1000 }, { t: 9.0, x: 1180 }, { t: 9.5, x: 1360 }];
const TRANS = [
  { t: 11.5, name: "SWIPE!", kind: "swipe", a: "cat", b: "skate", col: C.blue },
  { t: 12.5, name: "SPIN!", kind: "spin", a: "skate", b: "sunset", col: C.yellow },
  { t: 13.5, name: "WIPE!", kind: "wipe", a: "sunset", b: "food", col: C.mint },
  { t: 14.5, name: "GLITCH!", kind: "glitch", a: "food", b: "dance", col: C.pink },
];

// ------------------------------------------------------------------ Opus (the editor!)
function opusState(t) {
  const s = { x: 330, y: 650, s: 1, sx: 1, sy: 1, lean: 0, eyes: "open", mouth: "smile",
    armL: .35, armR: .35, head: 1, prop: null, hover: false, blush: .55, sweat: 0, look: 0 };
  const bob = Math.sin(t * 6) * .02;
  s.sx = 1 - bob; s.sy = 1 + bob;
  const p = pulse(t, 10);

  if (t < 3) {
    s.mouth = "open";
    if (t > 1.1) s.armR = 2.5 + Math.sin((t - 1.1) * 15) * .35;
    if (t > 1.6 && t < 1.75) s.eyes = "closed";
  } else if (t < 7) {
    s.mouth = "grin"; s.look = .5;
    s.sy += p * .05; s.sx -= p * .04;
    let a = .3;
    for (const c of CLIPS) {
      const th = c.land - .4, q = seg(t, th - .2, th + .1);
      if (t > th - .2 && t < th + .25) a = q < 1 ? lerp(.2, 2.3, E.out(q)) : lerp(2.3, .9, seg(t, th + .1, th + .25));
    }
    s.armR = t > 5.5 ? lerp(.9, .35, seg(t, 5.5, 6)) : a;
    if (t > 6) { s.eyes = "happy"; s.mouth = "open"; s.armL = .35 + p * .3; s.armR = .35 + p * .3; }
  } else if (t < 11.2) {
    s.prop = "scissors"; s.hover = true;
    // hop from desk to above the timeline, then slide cut-to-cut
    const pts = [[7.0, 330, 650], [7.4, 610, 300]];
    for (const c of CUTS) pts.push([c.t - .1, c.x - 40, 300]);
    let pos = [330, 650];
    if (t < 7.4) {
      const q = E.inOut(seg(t, 7.0, 7.4));
      pos = [lerp(330, 610, q), lerp(650, 300, q) - Math.sin(q * Math.PI) * 120];
    } else {
      pos = [610, 300];
      for (let i = 0; i < CUTS.length; i++) {
        const c = CUTS[i], px = i ? CUTS[i - 1].x - 40 : 610;
        if (t >= c.t - .4) pos = [lerp(px, c.x - 40, E.inOut(seg(t, c.t - .4, c.t - .1))), 300 - Math.sin(seg(t, c.t - .4, c.t - .1) * Math.PI) * 30];
      }
    }
    s.x = pos[0]; s.y = pos[1];
    s.armR = .15; s.armL = .6 + p * .2;
    s.mouth = "grin"; s.eyes = "focus";
    if (t > 9.5) { s.eyes = "wide"; s.mouth = "o"; s.look = 1; }
    if (t > 10.0) { s.armL = 2.75; s.armR = 2.75; s.sweat = seg(t, 10, 10.2); s.prop = t < 10.8 ? "scissors-hidden" : null; s.lean = Math.sin(t * 30) * .03 * (1 - seg(t, 10, 10.5)); }
    if (t > 10.8) {
      const q = E.inOut(seg(t, 10.8, 11.2));
      s.x = lerp(1320, 1390, q); s.y = lerp(300, 340, q) - Math.sin(q * Math.PI) * 40;
      s.armL = lerp(2.75, .4, q); s.armR = lerp(2.75, .4, q); s.eyes = "happy"; s.mouth = "grin"; s.sweat = 1 - q;
    }
  } else {
    s.hover = true; s.x = 1390; s.y = 340;
  }

  if (t >= 11.2 && t < 15) {
    s.eyes = "happy"; s.mouth = "grin"; s.look = -1;
    s.armL = .5; s.armR = .4 + p * .25;
    for (const tr of TRANS) {
      const q = seg(t, tr.t - .25, tr.t);
      if (t > tr.t - .25 && t < tr.t + .3) s.armL = t < tr.t ? lerp(.5, 1.9, E.out(q)) : lerp(1.9, .5, seg(t, tr.t + .05, tr.t + .3));
      if (Math.abs(t - tr.t) < .15) { s.eyes = "star"; s.mouth = "open"; }
    }
    s.sy += p * .04; s.sx -= p * .03;
  } else if (t >= 15 && t < 19) {
    s.prop = "keyboard"; s.look = -.6;
    const typing = (t < 16.5) || (t > 17.5 && t < 18);
    s.armL = .75 + (typing ? Math.max(0, Math.sin(t * 50)) * .25 : 0);
    s.armR = .75 + (typing ? Math.max(0, Math.sin(t * 50 + 1.6)) * .25 : 0);
    s.eyes = "focus"; s.mouth = "smile";
    if (t > 16.5 && t < 17) { s.eyes = "wide"; s.mouth = "o"; s.sweat = seg(t, 16.5, 16.7); }
    if (t >= 17 && t < 17.5) { s.armR = 2.95; s.eyes = "closed"; s.mouth = "flat"; s.lean = -.08; s.sweat = 1; }
    if (t >= 17.5) s.sweat = 1 - seg(t, 17.5, 17.7);
    if (t >= 18 && t < 18.7) { s.armL = 2.6; s.armR = 2.6; s.eyes = "happy"; s.mouth = "open"; s.sy *= 1.05; }
  } else if (t >= 19 && t < 22) {
    s.prop = "wand"; s.look = -.8; s.eyes = "happy"; s.mouth = "grin";
    s.armR = .6;
    for (const tw of [19, 19.5, 20]) {
      if (t > tw - .2 && t < tw + .25) s.armR = t < tw ? lerp(.6, 2.6, E.out(seg(t, tw - .2, tw))) : lerp(2.6, .6, seg(t, tw, tw + .25));
    }
    if (t >= 20.5) {
      s.head = 1 + .9 * E.elastic(seg(t, 20.5, 21.1)) * (1 - E.back(seg(t, 21.5, 21.7)));
      s.eyes = t < 21.5 ? (t % .6 < .08 ? "closed" : "wide") : "dizzy";
      s.mouth = t < 21.5 ? "wobbly" : "open";
      s.armL = 1.4 + Math.sin(t * 25) * .3; s.armR = 1.4 + Math.sin(t * 25 + 2) * .3;
      s.prop = "wand-dropped";
    }
  } else if (t >= 22 && t < 27) {
    s.look = 0;
    const fly = E.inOut(seg(t, 22, 22.45));
    s.hover = fly < 1;
    s.x = lerp(1390, 1600, fly); s.y = lerp(340, 650, fly) - Math.sin(fly * Math.PI) * 80;
    const b = Math.floor(t / BEAT), ph = (t % BEAT) / BEAT;
    s.eyes = "happy"; s.mouth = "open";
    if (t >= 22.45 && t < 24.6) { // dance on every beat
      s.armL = b % 2 ? 2.7 : .5; s.armR = b % 2 ? .5 : 2.7;

function segmentsAt(t) {
  // video-track pieces after cuts, each {type, x, w, src (offset into clip)}
  const pieces = [];
  for (const c of CLIPS) pieces.push({ type: c.type, x0: c.x, w: c.w, src: 0, land: c.land });
  let shiftList = [];
  for (const cut of CUTS) {
    if (t < cut.t) continue;
    const i = pieces.findIndex(p => cut.x > p.x0 && cut.x < p.x0 + p.w);
    if (i < 0) continue;
    const p = pieces[i], left = cut.x - p.x0;
    pieces.splice(i, 1, { ...p, w: left }, { ...p, x0: cut.x, w: p.w - left, src: p.src + left, cutT: cut.t });
    shiftList.push(cut);
  }
  for (const p of pieces) {
    let sh = 0;
    for (const cut of shiftList) if (p.x0 >= cut.x) sh += 8 * E.back(seg(t, cut.t, cut.t + .25));
    p.x = p.x0 + sh;
  }
  return pieces;
}

function drawThumbStrip(p, y, h, t) {
  // filmstrip look: repeated frames of the clip
  ctx.save(); rr(p.x, y, p.w, h, 8); ctx.clip();
  const fw = 64;
  for (let fx = -((p.src) % fw); fx < p.w; fx += fw) drawThumb(p.type, p.x + fx, y, fw, h, 1.3 + (p.src + fx) * .01, { r: 0 });
  ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 2.5; rr(p.x + 1, y + 1, p.w - 2, h - 2, 8); ctx.stroke();
}

}

function transition(tr, p, t, x, y, w, h) {
  const A = (lt) => drawThumb(tr.a, x, y, w, h, lt, { r: 0 });
  const B = (lt) => drawThumb(tr.b, x, y, w, h, lt, { r: 0 });
  const q = E.inOut(p);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  if (tr.kind === "swipe") {
    ctx.save(); ctx.translate(-q * w, 0); A(t); ctx.restore();
    ctx.save(); ctx.translate((1 - q) * w, 0); B(t); ctx.restore();
    ctx.fillStyle = "rgba(255,255,255,.6)";
    for (let i = 0; i < 6; i++) ctx.fillRect(x + (1 - q) * w - 40 - rnd(i) * 80, y + h * rnd(i + 5), 60 + rnd(i) * 90, 4);
  } else if (tr.kind === "spin") {
    const cx = x + w / 2, cy = y + h / 2;
    ctx.save(); ctx.translate(cx, cy);
    if (q < .5) { ctx.rotate(q * 2.5); ctx.scale(1 + q * 1.2, 1 + q * 1.2); ctx.translate(-cx, -cy); A(t); }
    else { ctx.rotate(-(1 - q) * 2.5); ctx.scale(1 + (1 - q) * 1.2, 1 + (1 - q) * 1.2); ctx.translate(-cx, -cy); B(t); }
    ctx.restore();
    ctx.fillStyle = `rgba(255,255,255,${.6 * Math.sin(q * Math.PI)})`; ctx.fillRect(x, y, w, h);
  } else if (tr.kind === "wipe") {
    A(t);
    ctx.save(); circle(x + w / 2, y + h / 2, q * Math.hypot(w, h) / 2); ctx.clip(); B(t); ctx.restore();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 6; circle(x + w / 2, y + h / 2, q * Math.hypot(w, h) / 2); ctx.stroke();
  } else {
    const slices = 9;
    for (let i = 0; i < slices; i++) {
      const sy = y + i * h / slices, show = rnd(i + Math.floor(t * 30)) < q;
      ctx.save(); ctx.beginPath(); ctx.rect(x, sy, w, h / slices + 1); ctx.clip();
      ctx.translate((rnd(i * 3 + Math.floor(t * 40)) - .5) * 60 * Math.sin(q * Math.PI), 0);
      show ? B(t) : A(t);
      ctx.restore();
    }
    ctx.globalCompositeOperation = "screen";
    ctx.fillStyle = `rgba(0,255,255,${.35 * Math.sin(q * Math.PI)})`; ctx.fillRect(x + 8, y, w, h);
    ctx.fillStyle = `rgba(255,0,128,${.35 * Math.sin(q * Math.PI)})`; ctx.fillRect(x - 8, y, w, h);
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.restore();
}

}

  if (t >= 6 && t < 7) ph = lerp(TL.x + 30, TL.x + TL.w - 30, E.inOut(seg(t, 6, 7)));
  else if (t >= 7 && t < 22) ph = TL.x + 30;
  else if (t >= 22 && t < 25) ph = lerp(TL.x + 30, TL.x + TL.w - 30, seg(t, 22, 25));
  else if (t >= 25) ph = TL.x + TL.w - 30;
  ctx.fillStyle = "#fff"; ctx.fillRect(ph - 1.5, TL.y + 4, 3, TL.h - 8);
  ctx.beginPath(); ctx.moveTo(ph - 9, TL.y + 2); ctx.lineTo(ph + 9, TL.y + 2); ctx.lineTo(ph, TL.y + 14); ctx.fill();

  // export modal
  if (t >= 25) {
    const a = seg(t, 25, 25.15);
    ctx.fillStyle = `rgba(10,8,20,${.6 * a})`; ctx.fillRect(SCR.x, SCR.y, SCR.w, SCR.h);
    const s = E.back(seg(t, 25.05, 25.35));
    ctx.save(); ctx.translate(SCR.x + SCR.w / 2, SCR.y + SCR.h / 2); ctx.scale(s, s);
    ctx.fillStyle = "#fff"; rr(-230, -120, 460, 240, 30); ctx.fill();
    const steps = [25.5, 26, 26.5, 27];
    let pct = 0; steps.forEach((st, i) => { if (t >= st) pct = (i + 1) * 25; });
    const shown = pct - 25 * (1 - E.out(seg(t, steps[Math.max(0, pct / 25 - 1)] || 25, (steps[Math.max(0, pct / 25 - 1)] || 25) + .2))) * (pct > 0);
    const done = t >= 27;
    label(done ? "DONE!" : "Exporting...", 0, -55, done ? 56 : 40, done ? C.mint : C.purple, { shadow: false, stroke: .12, scale: done ? E.back(seg(t, 27, 27.25)) : 1 });
    ctx.fillStyle = "#ECE8FF"; rr(-180, 0, 360, 34, 17); ctx.fill();
    const g = ctx.createLinearGradient(-180, 0, 180, 0); g.addColorStop(0, C.pink); g.addColorStop(1, C.purple);
    ctx.fillStyle = g; rr(-180, 0, Math.max(34, 360 * shown / 100), 34, 17); ctx.fill();
    ctx.font = F(700, 30); ctx.fillStyle = C.ink; ctx.textAlign = "center"; ctx.fillText(`${Math.round(shown)}%`, 0, 72);
    ctx.restore();
  }
  ctx.restore(); // screen clip
  // glare
  ctx.fillStyle = "rgba(255,255,255,.04)"; ctx.beginPath(); ctx.moveTo(SCR.x, SCR.y); ctx.lineTo(SCR.x + 360, SCR.y); ctx.lineTo(SCR.x + 120, SCR.y + SCR.h); ctx.lineTo(SCR.x, SCR.y + SCR.h); ctx.fill();
}

function drawShrimp() {
  ctx.fillStyle = "#FF8C69"; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 34, Math.PI * .8, Math.PI * 2.1); ctx.arc(0, 0, 14, Math.PI * 2.1, Math.PI * .8, true); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "#E85D3F"; for (let i = 0; i < 4; i++) { const a = Math.PI * (1 + i * .25); ctx.beginPath(); ctx.moveTo(Math.cos(a) * 15, Math.sin(a) * 15); ctx.lineTo(Math.cos(a) * 33, Math.sin(a) * 33); ctx.stroke(); }
  ctx.fillStyle = "#FF8C69"; ctx.strokeStyle = C.ink;
  ctx.beginPath(); ctx.moveTo(-30, 16); ctx.lineTo(-48, 30); ctx.lineTo(-24, 34); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ink; circle(28, -6, 4); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(32, -10); ctx.quadraticCurveTo(52, -36, 60, -20); ctx.stroke();
}

// ------------------------------------------------------------------ camera
function camera(t) {
  let [cx, cy, z] = keys(t, [
    [0, [1015, 300, 3.3]],
    [0.75, [1015, 300, 3.3]],
    [2.7, [960, 520, 1.0], "inOut"],
    [3.1, [960, 520, 1.0]],
    [3.6, [880, 540, 1.28]],
    [6.6, [960, 540, 1.32], "lin"],
    [7.3, [780, 450, 1.5]],
    [9.4, [1120, 450, 1.5], "lin"],
    [9.9, [1120, 450, 1.5]],
    [10.8, [1120, 450, 1.5]],
    [11.3, [1080, 360, 2.0]],
    [15.0, [1060, 370, 2.05], "lin"],
    [15.3, [1080, 380, 2.0]],
    [18.9, [1080, 380, 2.0], "lin"],
    [19.3, [1040, 420, 1.55]],
    [20.45, [1040, 420, 1.6], "lin"],
    [20.6, [1390, 300, 2.7], "out"],
    [21.5, [1390, 300, 2.85], "lin"],
    [22.1, [960, 540, 1.0], "inOut"],
    [27.0, [960, 540, 1.0]],
    [28.0, [960, 520, 1.3], "inOut"],
    [30.0, [960, 510, 1.38], "lin"],
  ]);
  const amp = t >= 22 && t < 28 ? .03 : t >= 3 && t < 20.5 ? .012 : 0;
  z *= 1 + amp * pulse(t, 9);
  // bonk shake + export slam shake
  let sh = 0;
  if (t >= 10 && t < 10.4) sh = 18 * (1 - seg(t, 10, 10.4));
  if (t >= 25 && t < 25.3) sh = 10 * (1 - seg(t, 25, 25.3));
  if (t >= 20.5 && t < 20.7) sh = 8 * (1 - seg(t, 20.5, 20.7));
  return { cx: cx + Math.sin(t * 97) * sh / z, cy: cy + Math.cos(t * 83) * sh / z, z };
}
const toScreen = (cam, x, y) => [(x - cam.cx) * cam.z + W / 2, (y - cam.cy) * cam.z + H / 2];

// ------------------------------------------------------------------ world-space props & fx
function drawPropsAndFx(t, s) {
  const [hx, hy] = handPos(s, 1);
  if (s.prop === "scissors") {
    let open = .35;
    for (const c of CUTS) { if (t >= c.t - .35 && t < c.t) open = .45 * E.out(seg(t, c.t - .35, c.t - .05)); if (t >= c.t && t < c.t + .3) open = .02 + .3 * seg(t, c.t + .05, c.t + .3); }
    const appear = E.back(seg(t, 7.0, 7.3));
    ctx.save(); ctx.translate(hx, hy); ctx.scale(appear, appear); ctx.translate(-hx, -hy);
    drawScissors(hx, hy + 10, 125, open, 0);
    ctx.restore();
    if (t >= 7 && t < 7.4) sparkleBurst(t, 7, hx, hy + 40, 60, 10);
  }
  if (s.prop === "wand") drawWand(hx, hy, s.armR > 1.5 ? -.4 : -.15, t);
  if (s.prop === "wand-dropped") {
    const q = seg(t, 20.5, 21.2);
    drawWand(1450 + q * 30, lerp(450, 640, E.in(q)), -.4 + q * 2.5, t);
  }
  if (s.prop === "keyboard") {
    const a = E.back(seg(t, 15, 15.25)) * (1 - E.in(seg(t, 18.75, 19)));
    ctx.save(); ctx.translate(s.x, s.y + 140); ctx.scale(a, a); ctx.translate(-s.x, -s.y - 140);
    drawKeyboard(s.x, s.y + 116, t, s);
    ctx.restore();
  }
  if (s.prop === "phone") {
    const a = E.back(seg(t, 27, 27.3));
    const pw = 150 * a * s.s, ph = 266 * a * s.s;
    drawPhone(hx + 40 * a * s.s, hy - 120 * a * s.s, pw, ph, t, .08);
    if (t > 27.8) for (let i = 0; i < 7; i++) { // proud twinkles
      const q = (t * .9 + rnd(i)) % 1, ang = rnd(i + 3) * Math.PI * 2;
      ctx.fillStyle = `rgba(255,210,63,${Math.sin(q * Math.PI)})`;
      star4(s.x + 40 + Math.cos(ang) * 290, s.y - 50 + Math.sin(ang) * 220, 10 + 12 * Math.sin(q * Math.PI), t); ctx.fill();
    }
  }
  // wand blasts
  for (const [tw, tx, ty] of [[19, 1015, 300], [19.5, 950, 260], [20, 1015, 320]]) {
    if (t >= tw - .05 && t < tw + .35) {
      const q = seg(t, tw - .05, tw + .25);
      ctx.strokeStyle = `rgba(255,210,63,${1 - seg(t, tw + .2, tw + .35)})`; ctx.lineWidth = 8; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(1440, 230); ctx.quadraticCurveTo(1250, 150, lerp(1440, tx, q), lerp(230, ty, q)); ctx.stroke();
      sparkleBurst(t, tw + .15, tx, ty, 90, 8);
    }
  }
  if (t >= 20.35 && t < 20.6) { // the misfire, boomeranging back to Opus
    const q = seg(t, 20.35, 20.55);
    ctx.strokeStyle = C.red; ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(1440, 230); ctx.bezierCurveTo(1200, 120, 1250, 420, lerp(1300, 1390, q), lerp(380, 300, q)); ctx.stroke();
  }

  // section labels (world space, comic stickers)
  CUTS.forEach((c, i) => burstLabel(t, c.t, i === 4 ? "OOPS" : "SNIP!", c.x + 110, 420, 40, i === 4 ? C.red : C.yellow, (i % 2 ? .12 : -.12)));
  TRANS.forEach(tr => burstLabel(t, tr.t, tr.name, 1015, 205, 40, tr.col, -.08, .5));
  burstLabel(t, 19, "SPARKLE", 900, 210, 36, C.yellow, -.1, .4);
  burstLabel(t, 19.5, "HEARTS", 1110, 205, 36, C.pink, .1, .4);
  burstLabel(t, 20, "ZOOM!", 960, 330, 44, C.blue, -.05, .35);
  burstLabel(t, 22.05, "AUTO BEAT SYNC", 1010, 455, 46, C.mint, -.04, 1.6);
  if (t >= 3.5 && t < 6) CLIPS.forEach(c => burstLabel(t, c.land, "+1", c.x + c.w / 2, TRACK.video[0] - 30, 30, C.mint, 0, .3));
  burstLabel(t, 1.2, "let's make something fun!", 960, 120, 64, C.yellow, -.03, 1.4);
}

function sparkleBurst(t, at, x, y, R, n) {
  const q = seg(t, at, at + .4);
  if (q <= 0 || q >= 1) return;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + at;
    ctx.fillStyle = RAINBOW[i % 6]; ctx.globalAlpha = 1 - q;
    star4(x + Math.cos(a) * R * E.out(q), y + Math.sin(a) * R * E.out(q), 9 * (1 - q) + 3, t * 4); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ------------------------------------------------------------------ screen-space overlays
function drawOverlays(t, cam) {
  // intro cursor clicking "+"
  if (t < 1.0) {
    const [bx, by] = toScreen(cam, PV.x + PV.w / 2 + 10, PV.y + PV.h / 2);
    const q = E.inOut(seg(t, 0, .42));
    const x = lerp(bx + 320, bx, q), y = lerp(by + 260, by, q);
    const press = t > .42 && t < .62 ? .85 : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(1.6 * press, 1.6 * press); ctx.rotate(-.3);
    ctx.globalAlpha = 1 - seg(t, .8, 1);
    ctx.fillStyle = "#fff"; ctx.strokeStyle = C.ink; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 46); ctx.lineTo(12, 35); ctx.lineTo(22, 56); ctx.lineTo(30, 52); ctx.lineTo(20, 32); ctx.lineTo(36, 32); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // runaway clip piece flies at the lens... BONK
  if (t >= 9.5 && t < 11.2) {
    const piece = { type: "food", src: 1360 - CLIPS[4].x, w: 85 };
    const [sx0, sy0] = toScreen(cam, 1400, TRACK.video[0] + 29);
    let x, y, w, rot;
    if (t < 10) { const q = E.in(seg(t, 9.5, 10)); x = lerp(sx0, 980, q); y = lerp(sy0, 520, q) - Math.sin(q * Math.PI) * 240; w = lerp(85 * cam.z, 760, q); rot = q * 6.3; }
    else if (t < 10.55) { x = 980; y = 520; w = 760; rot = Math.sin((t - 10) * 40) * .05 * (1 - seg(t, 10, 10.4)); }
    else { const q = seg(t, 10.55, 11.2); x = 980 + q * 60; y = 520 + E.in(q) * 900; w = 760; rot = q * .6; }
    const h = w * 58 / 85;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    if (t >= 10) { ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 40; }
    ctx.fillStyle = "#fff"; rr(-w / 2 - 10, -h / 2 - 10, w + 20, h + 20, 24); ctx.fill();
    ctx.shadowColor = "transparent";
    drawThumb(piece.type, -w / 2, -h / 2, w, h, 10, { r: 16 });
    ctx.restore();
    if (t >= 10 && t < 10.7) {
      const q = seg(t, 10, 10.7);
      for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + t * 3; ctx.fillStyle = RAINBOW[i % 6]; ctx.globalAlpha = 1 - q; starN(980 + Math.cos(a) * (430 + q * 80), 520 + Math.sin(a) * (300 + q * 60), 30, 5); ctx.fill(); }
      ctx.globalAlpha = 1;
      label("BONK!", 980, 160, 110, C.yellow, { scale: E.back(seg(t, 10, 10.2)), rot: -.1, alpha: 1 - seg(t, 10.5, 10.7) });
    }
  }
  // freeze-frame meme during the big-head gag
  if (t >= 20.5 && t < 21.55) {
    ctx.fillStyle = `rgba(255,190,120,${.16})`; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.fillRect(0, 0, W, 60); ctx.fillRect(0, H - 60, W, 60);
    const txt = "yep. that's me.";
    const n = Math.ceil(seg(t, 20.62, 21.0) * txt.length);
    ctx.fillStyle = "rgba(43,34,80,.85)"; rr(70, 860, 560, 110, 24); ctx.fill();
    ctx.font = F(600, 54); ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
    ctx.fillText(txt.slice(0, n), 105, 917);
    label("*record scratch*", 1500, 120, 46, "#fff", { rot: .05, scale: E.back(seg(t, 20.5, 20.7)) });
    label("EFFECT: BIG HEAD", 1500, 960, 50, C.red, { rot: -.05, scale: E.back(seg(t, 20.6, 20.85)) });
  }
  if (t >= 21.5 && t < 21.9) label("POP!", 960, 300, 120, C.yellow, { scale: E.back(seg(t, 21.5, 21.65)), alpha: 1 - seg(t, 21.75, 21.9), rot: .08 });
  // confetti
  if (t >= 27) {
    const tt = t - 27;
    for (let i = 0; i < 160; i++) {
      const side = i % 2 ? 1 : -1;
      const vx = side * (200 + rnd(i) * 700) * -1, vy = -(600 + rnd(i + 50) * 900);
      const x0 = side > 0 ? W + 20 : -20, y0 = H * .85;
      const x = x0 + vx * tt * (1 - Math.min(tt, 2) * .25), y = y0 + vy * tt + 900 * tt * tt;
      if (y > H + 40) continue;
      ctx.save(); ctx.translate(x + Math.sin(tt * 6 + i) * 20, y); ctx.rotate(tt * (4 + rnd(i + 9) * 8) + i);
      ctx.fillStyle = RAINBOW[i % 6];
      if (i % 4 === 0) { star4(0, 0, 12, 0); ctx.fill(); } else { ctx.scale(1, Math.cos(tt * 10 + i)); ctx.fillRect(-9, -5, 18, 10); }
      ctx.restore();
    }
  }
  // end card signature
  if (t >= 28) {
    const x = 1440, y = 520;
    const a = seg(t, 28, 28.4);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(255,250,244,.85)"; rr(x - 330, y - 170, 660, 340, 40); ctx.fill();
    ctx.strokeStyle = C.pink; ctx.lineWidth = 6; rr(x - 330, y - 170, 660, 340, 40); ctx.stroke();
    ctx.font = F(600, 34); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = C.purple;
    ctx.fillText("edited with love, on beat, by", x, y - 110);
    ctx.restore();
    // handwritten reveal
    ctx.save();
    ctx.beginPath(); ctx.rect(x - 320, y - 90, 640 * E.inOut(seg(t, 28.25, 29.0)), 180); ctx.clip();
    ctx.font = "120px Pacifico"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const g = ctx.createLinearGradient(x - 260, 0, x + 260, 0); g.addColorStop(0, C.coral); g.addColorStop(.5, C.pink); g.addColorStop(1, C.purple);
    ctx.lineWidth = 14; ctx.strokeStyle = "#fff"; ctx.lineJoin = "round"; ctx.strokeText("Opus 5.5", x, y + 6);
    ctx.fillStyle = g; ctx.fillText("Opus 5.5", x, y + 6);
    ctx.restore();
    // underline swoosh
    const q = E.out(seg(t, 29.0, 29.35));
    if (q > 0) {
      ctx.strokeStyle = C.yellow; ctx.lineWidth = 10; ctx.lineCap = "round";
      ctx.beginPath();
      for (let k = 0; k <= 30 * q; k++) { const u = k / 30, xx = x - 250 + u * 500, yy = y + 105 - Math.sin(u * Math.PI) * 16 + u * 6; k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
      ctx.stroke();
      ctx.fillStyle = C.yellow; star4(x + 270, y + 100, 26 * E.back(seg(t, 29.2, 29.5)), t * 2); ctx.fill();
    }
  }
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, "rgba(43,34,80,0)"); v.addColorStop(1, "rgba(43,34,80,.35)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // fade in
  if (t < .15) { ctx.fillStyle = `rgba(0,0,0,${1 - t / .15})`; ctx.fillRect(0, 0, W, H); }
}

// ------------------------------------------------------------------ frame
window.renderFrame = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const cam = camera(t);
  ctx.setTransform(cam.z, 0, 0, cam.z, W / 2 - cam.cx * cam.z, H / 2 - cam.cy * cam.z);
  drawRoom(t);
  drawEditor(t);
  drawExportButton(t);
  if (t > 27.4) { // soft focus wash so the hero moment pops
    ctx.fillStyle = `rgba(255,236,246,${.6 * E.inOut(seg(t, 27.4, 28.2))})`;
    ctx.fillRect(-500, -500, W + 1000, H + 1000);
  }
  const s = opusState(t);
  drawOpus(t, s);
  drawPropsAndFx(t, s);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawOverlays(t, cam);
};
window.ready = (async () => {
  await document.fonts.load(F(700, 20)); await document.fonts.load(F(600, 20)); await document.fonts.load(F(500, 20));
  await document.fonts.load("120px Pacifico");
  renderFrame(0);
  return true;
})();
</script>
</body>
</html>
